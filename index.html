<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8OXO8 — Spécifications Système & Architecture</title>
  <style>
    :root {
      --bg: #000000;
      --text: #e1e1e1;
      --text-muted: #777777;
      --border: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 6px;
      color: #ffffff;
      margin-bottom: 24px;
      text-align: center;
    }

    .logo-img {
      width: 520px;
      max-width: 100%;
      height: auto;
      margin-bottom: 24px;
      display: block;
      -webkit-mask-image: radial-gradient(circle 48% at 50% 50%, black 70%, transparent 85%);
      mask-image: radial-gradient(circle 48% at 50% 50%, black 70%, transparent 85%);
    }

    .hero-email {
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .hero-email a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #333333;
      padding-bottom: 2px;
      transition: border-color 0.3s;
    }

    .hero-email a:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <main class="hero">
    <h1>8OXO8</h1>
    <img src="logo.png" alt="8OXO8 Logo" class="logo-img">
    <div class="hero-email">
      <a href="mailto:air@8oxo8.com">air@8oxo8.com</a>
    </div>
  </main>

</body>
</html>
