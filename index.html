<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>8OXO8</title>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #000000;
      color: #ffffff;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .hero {
      width: min(900px, 100%);
      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 6px;

      margin-bottom: 24px;
    }

    .logo-img {
      width: 700px;
      max-width: 100%;
      height: auto;

      display: block;
      margin-bottom: 28px;

      -webkit-mask-image:
        radial-gradient(
          circle,
          black 62%,
          transparent 96%
        );

      mask-image:
        radial-gradient(
          circle,
          black 62%,
          transparent 96%
        );
    }

    .hero-email {
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .hero-email a {
      color: #ffffff;
      text-decoration: none;

      border-bottom: 1px solid #333333;

      padding-bottom: 3px;

      transition:
        border-color 0.3s ease;
    }

    .hero-email a:hover {
      border-color: #ffffff;
    }
  </style>
</head>

<body>

  <main class="hero">

    <h1>8OXO8</h1>

    <!--
      TON LOGO
      Remplace la valeur ci-dessous par le Base64
      du PNG si tu veux conserver le fichier totalement autonome.
    -->

    <img
      src="data:image/png;base64,ICI_BASE64_DU_LOGO"
      alt="8OXO8 Logo"
      class="logo-img"
    >

    <div class="hero-email">
      <a href="mailto:air@8oxo8.com">
        air@8oxo8.com
      </a>
    </div>

  </main>

</body>
</html>
